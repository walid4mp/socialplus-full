name: SocialPlus Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pandroid.enableMinifyInReleaseBuilds=false

      - name: Rename APK
        run: |
          mkdir -p out
          VER=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk out/SocialPlus-v$VER.apk
          ls -lh out

      - name: Verify APK signature
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs out/SocialPlus-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialPlus-Android-APK
          path: out/SocialPlus-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases (تنزيل مباشر بدون ZIP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SocialPlus Android v1.0.${{ github.run_number }}
          body: |
            ## 📱 SocialPlus APK — تثبيت مباشر
            حمّل الملف **SocialPlus-v1.0.0.apk** مباشرة (بدون ضغط ZIP).
            - تثبيت مباشر: اسمح بـ "مصادر غير معروفة" ثم افتح الملف
            - يتطلب Android 7.0 (API 24) أو أحدث
          files: out/SocialPlus-v*.apk
          makeLatest: true
