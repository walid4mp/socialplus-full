services:
  # Static web build of the Expo app (expo export --platform web)
  - type: web
    name: socialplus-full
    runtime: static
    buildCommand: npm ci --include=dev buildCommand: npm ci && npx expo export --platform webbuildCommand: npm ci && npx expo export --platform web npx expo export --platform web
    outputDir: dist
    envVars:
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      # SPA fallback so deep links work on the static site
      - type: rewrite
        source: /*
        destination: /index.html
